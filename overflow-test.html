<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Overflow Test</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: transparent;
      overflow: visible;
    }

    .container {
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: visible;
      pointer-events: none;
      background: rgba(255, 0, 0, 0.1); /* 调试用，看窗口范围 */
    }

    .content {
      width: 400px;
      height: 400px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-family: system-ui;
      font-size: 24px;
      font-weight: bold;
      pointer-events: auto;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
    }

    .content:hover {
      transform: scale(1.05);
      transition: transform 0.2s;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="content" onclick="alert('Content clicked!')">
      <div>
        <div>400x400 Content</div>
        <div style="font-size: 14px; margin-top: 10px;">
          Window: 116x42
        </div>
        <div style="font-size: 14px;">
          Should overflow and be clickable
        </div>
      </div>
    </div>
  </div>
</body>
</html>
