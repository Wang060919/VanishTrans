name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish installer
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4


      - name: Verify CI gate for tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          SHA="$(git rev-parse HEAD)"
          for attempt in $(seq 1 60); do
            RUN_ID="$(gh run list --workflow ci.yml --commit "$SHA" --limit 20 --json databaseId --jq '.[0].databaseId')"
            if [ -n "$RUN_ID" ]; then
              echo "Waiting for CI run $RUN_ID for $SHA"
              gh run watch "$RUN_ID" --exit-status
              exit 0
            fi
            sleep 10
          done
          echo "No successful CI gate found for $SHA" >&2
          exit 1
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # The tag points to a commit that already passed the main-branch CI gate,
      # so the full check suite does not need to run again here.
      - name: Build installer
        run: pnpm tauri build

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/*.exe
